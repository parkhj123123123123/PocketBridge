name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: ./scripts/publish-windows.ps1
      - shell: pwsh
        run: Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/PocketBridge-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBridge-Windows-x64
          path: artifacts/PocketBridge-Windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/PocketBridge-Windows-x64.zip
