name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build PocketBridge.slnx -c Release
      - run: dotnet run --project tests/PocketBridge.Tests -c Release --no-build
      - run: dotnet run --project tests/RelaySmoke -c Release --no-build
