name: PocketBridge
options:
  bundleIdPrefix: org.pocketbridge
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  PocketBridge:
    type: application
    platform: iOS
    sources:
      - path: PocketBridge
        excludes: [Info.plist]
    settings:
      base:
        INFOPLIST_FILE: PocketBridge/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.pocketbridge.sender
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ZIPFoundation
  PocketBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PocketBridgeTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PocketBridge
      - package: ZIPFoundation
schemes:
  PocketBridge:
    build:
      targets:
        PocketBridge: all
    test:
      targets: [PocketBridgeTests]
